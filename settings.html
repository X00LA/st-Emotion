<div id="emotion_settings">
  <div class="inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
      <div class="flex-container alignitemscenter margin0">
        <b>Emotion Plugin Settings</b>
      </div>
      <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
      <label for="emotion_api_url">LM Studio / OpenAI-compatible API URL:</label>
      <input id="emotion_api_url" type="text" class="text_pole" placeholder="http://127.0.0.1:1234/v1/completions" />

      <label for="emotion_model">Model Name (optional):</label>
      <input id="emotion_model" type="text" class="text_pole" placeholder="local-model" />

      <label for="emotion_api_key">API Key (only if required by your server):</label>
      <input id="emotion_api_key" type="text" class="text_pole" placeholder="Leave empty if not required" />

      <div class="flex-container alignitemscenter emotion_connection_row">
        <input id="emotion_test_connection" class="menu_button" type="button" value="Test Connection" />
        <span id="emotion_connection_status">Not tested</span>
      </div>

      <hr>

      <label for="emotion_position">Injection Position:</label>
      <select id="emotion_position">
        <option value="-1">None</option>
        <option value="2">Before Main Prompt</option>
        <option value="0">After Main Prompt</option>
        <option value="1">In-chat @ Depth</option>
      </select>

      <label for="emotion_depth">Injection Depth:</label>
      <input id="emotion_depth" type="number" min="0" class="text_pole" />

      <label for="emotion_role">Injected As:</label>
      <select id="emotion_role">
        <option value="0">System</option>
        <option value="1">User</option>
        <option value="2">Assistant</option>
      </select>
    </div>
  </div>
</div>
